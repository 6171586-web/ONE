name: Build and deploy buyback monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * 1-5"
    - cron: "30 0 * * 2-6"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore runtime cache
        uses: actions/cache@v4
        with:
          path: |
            data
            reports
          key: buyback-runtime-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            buyback-runtime-${{ runner.os }}-

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run monitor
        run: python -m buyback_monitor run --mode manual --update-mode incremental
        env:
          WECHAT_ENABLE_PUBLISH: "0"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
