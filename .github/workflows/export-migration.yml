name: Export runtime for Tencent migration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            data
            reports
          key: buyback-runtime-Linux-34675562041
          fail-on-cache-miss: true
      - name: Validate and package runtime
        run: |
          test -s data/monitor.sqlite
          python -c "import sqlite3; c=sqlite3.connect('data/monitor.sqlite'); assert c.execute('pragma integrity_check').fetchone()[0]=='ok'"
          tar -czf runtime.tar.gz data reports
      - uses: actions/upload-artifact@v4
        with:
          name: migration-runtime
          path: runtime.tar.gz
          retention-days: 1
